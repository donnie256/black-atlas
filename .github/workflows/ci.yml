name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SITE_URL: https://whatsblackatlas.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      RATE_LIMIT_SALT: ci-placeholder
      ADMIN_SECRET: ci-placeholder
      CRON_SECRET: ci-placeholder
      EVENTBRITE_PRIVATE_TOKEN: ci-placeholder
      TICKETMASTER_API_KEY: ci-placeholder
      GOOGLE_PLACES_API_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build
        run: npm run build
